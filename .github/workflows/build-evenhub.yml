name: Build Even Hub package
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: [app.json]
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run pack
      - run: test -s even-worship-v0.6.2.ehpk
      - uses: actions/upload-artifact@v4
        with:
          name: even-worship-v0.6.2-ehpk
          path: even-worship-v0.6.2.ehpk
          if-no-files-found: error
